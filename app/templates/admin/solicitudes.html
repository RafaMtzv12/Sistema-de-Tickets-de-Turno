{% extends "base.html" %}
{% block titulo %}Solicitudes{% endblock %}
{% block content %}
<section class="card ancho">
  <header class="card-head"><h1>Solicitudes</h1>
    <button id="btn-nueva" class="principal">+ Nueva solicitud</button>
  </header>

  <div class="toolbar">
    <input id="f-q" type="search" placeholder="Buscar por CURP o nombre">
    <select id="f-estatus">
      <option value="">Todos los estatus</option>
      <option>Pendiente</option><option>Resuelto</option>
    </select>
    <select id="f-mun">
      <option value="">Todos los municipios</option>
      {% for m in municipios %}<option value="{{ m.id }}">{{ m.nombre }}</option>{% endfor %}
    </select>
  </div>

  <div class="tabla-wrap">
    <table>
      <thead><tr><th>Turno</th><th>Municipio</th><th>CURP</th><th>Nombre</th><th>Asunto</th><th>Estatus</th><th>Acciones</th></tr></thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
  <p id="vacio" class="nota" hidden>Sin resultados.</p>
</section>

<dialog id="modal">
  <h2 id="modal-titulo">Solicitud</h2>
  {% include "_form_ticket.html" %}
  <div class="acciones">
    <button type="submit" form="form-ticket" class="principal">Guardar</button>
    <button type="button" id="btn-cancelar">Cancelar</button>
  </div>
</dialog>
{% endblock %}
{% block scripts %}
<script src="{{ url_for('static', filename='js/ticket_form.js') }}"></script>
<script src="{{ url_for('static', filename='js/solicitudes.js') }}"></script>
{% endblock %}
