{% extends "base.html" %}
{% block titulo %}Acceso administrador{% endblock %}
{% block content %}
<section class="card login">
  <h1>Acceso administrador</h1>
  <form method="post">
    <div class="campo">
      <label for="usuario">Usuario</label>
      <input id="usuario" name="usuario" type="text" required autofocus>
    </div>
    <div class="campo">
      <label for="password">Contraseña</label>
      <input id="password" name="password" type="password" required>
    </div>
    <div class="campo">
      <label for="captcha">Captcha</label>
      <div class="captcha">
        <img id="img-captcha" src="{{ url_for('auth.captcha') }}" alt="captcha">
        <button type="button" id="btn-captcha" title="Otra imagen">↻</button>
      </div>
      <input id="captcha" name="captcha" type="text" autocomplete="off" required>
    </div>
    <button type="submit" class="principal">Entrar</button>
  </form>
</section>
{% endblock %}
{% block scripts %}
<script src="{{ url_for('static', filename='js/login.js') }}"></script>
{% endblock %}
